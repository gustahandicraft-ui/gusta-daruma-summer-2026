<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>gusta.handicraft｜DARUMA 後台管理</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
emailjs.init("Bv3jNth_VV48IwhIK");
</script>

<style>
body {
  font-family: "Helvetica", "Noto Sans TC", sans-serif;
  background: #f8f3ed;
  padding: 20px;
  color: #5c4b3b;
}

h1 {
  margin-bottom: 10px;
}

.card {
  background: white;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 10px;
  line-height: 1.7;
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 10px;
  background: #d6bfa6;
  color: white;
  cursor: pointer;
  margin-top: 6px;
  margin-right: 6px;
}

input {
  padding: 8px;
  width: 100%;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
  margin-bottom: 8px;
}

.stats {
  background: white;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 18px;
}

.stats-group {
  background: #fffaf5;
  padding: 12px;
  border-radius: 12px;
}

.stats-group h4 {
  margin-top: 0;
  margin-bottom: 10px;
}

.orders-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 16px;
}

.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 999px;
  background: #fff8f1;
  color: #8a6b4f;
  font-size: 12px;
  margin-bottom: 6px;
}

.section-title {
  margin-top: 26px;
}
</style>
</head>

<body onload="checkPassword()">

<h1>🧵 gusta.handicraft｜DARUMA 後台</h1>

<div class="stats">
  <button onclick="exportCSV()">匯出訂單 CSV</button>
  <button onclick="exportWishlistCSV()">匯出許願池 CSV</button>

  <h3>📊 DARUMA 預購統計</h3>

  <p id="totalOrders">訂單數：0</p>
  <p id="totalAmount">訂單總金額：$0</p>

  <ul id="productStats"></ul>
</div>

<div style="margin-bottom:15px;">
  <input
    id="searchOrder"
    placeholder="搜尋姓名 / Email / IG / 訂單編號 / 商品"
  >

  <button onclick="searchAdminOrder()">搜尋訂單</button>
  <button onclick="clearAdminSearch()">顯示全部</button>
</div>

<h2 class="section-title">📦 DARUMA 訂單</h2>
<div id="orders" class="orders-grid"></div>

<h2 class="section-title">✨ DARUMA 許願池</h2>
<div id="wishlist" class="orders-grid"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDm6qL6HhI_6nv0Uahrb6RqVFh0V7nI000",
  authDomain: "gusta-handicraft-91753.firebaseapp.com",
  projectId: "gusta-handicraft-91753"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const ORDER_COLLECTION = "daruma_2026_summer";
const WISHLIST_COLLECTION = "daruma_wishlist";
const PRODUCTS_API =
  "https://script.google.com/macros/s/AKfycbwERk9oo52ntE_DeTAA_62rBaf5uKdxoaBzSjUrKcR7kF-89UshAairec9LifnXlRVaCA/exec";

let productNames = {};
let priceMap = {};
let productSeries = {};

function formatTime(created) {
  if (!created) return "";

  const time = created?.seconds
    ? new Date(created.seconds * 1000)
    : new Date(created);

  return time.toLocaleString();
}

function formatMoney(num) {
  return Number(num || 0).toLocaleString("zh-TW");
}

function loadProducts() {
  return fetch(PRODUCTS_API)
    .then(res => res.json())
    .then(data => {
      data.forEach(p => {
        if (!p.id) return;

        productNames[p.id] = p.name || p.id;
        priceMap[p.id] = Number(p.price || 0);
        productSeries[p.id] = p.series || "DARUMA";
      });

      console.log("DARUMA products loaded:", data.length);
    })
    .catch(err => {
      console.error("商品資料讀取失敗", err);
      alert("商品資料讀取失敗，後台仍可顯示訂單，但金額與商品名稱可能不完整。");
    });
}

function getOrderItems(cart) {
  return Object.entries(cart || {}).map(([id, qty]) => {
    return {
      id,
      qty,
      name: productNames[id] || id,
      price: priceMap[id] || 0,
      subtotal: (priceMap[id] || 0) * qty,
      series: productSeries[id] || "DARUMA"
    };
  });
}

function getOrderTotal(cart) {
  return getOrderItems(cart).reduce((sum, item) => {
    return sum + item.subtotal;
  }, 0);
}

function renderOrders(snapshot) {
  const container = document.getElementById("orders");
  const statsEl = document.getElementById("productStats");

  container.innerHTML = "";
  statsEl.innerHTML = "";

  let totalOrders = 0;
  let totalAmount = 0;
  let productStats = {};

  snapshot.forEach(doc => {
    totalOrders++;

    const d = doc.data();
    const items = getOrderItems(d.cart);
    const orderTotal = getOrderTotal(d.cart);

    totalAmount += orderTotal;

    items.forEach(item => {
      if (!productStats[item.id]) {
        productStats[item.id] = {
          name: item.name,
          qty: 0,
          amount: 0,
          series: item.series
        };
      }

      productStats[item.id].qty += Number(item.qty || 0);
      productStats[item.id].amount += item.subtotal;
    });

    const div = document.createElement("div");
    div.className = "card admin-order-card";

    div.innerHTML = `
      <span class="badge">DARUMA</span><br>

      <b>${d.orderId || ""}</b><br>

👤 ${d.name || ""}<br>
IG：${d.ig || ""}<br>
Email：${d.email || ""}<br>

📦 收件人：${d.receiverName || ""}<br>
📞 手機：${d.receiverPhone || ""}<br>
🏪 門市：${d.receiverStore || ""}<br>
🏪 店號：${d.receiverStoreCode || ""}<br>
💳 末五碼：${d.paymentLast5 || ""}<br><br>

      🧶 ${
        items
          .map(item => `${item.name} x ${item.qty}（$${formatMoney(item.subtotal)}）`)
          .join("<br>")
      }
      <br><br>

      📦 狀態：${d.status || "未付款"}<br>
      💰 訂單金額：$${formatMoney(orderTotal)}<br>

      📨 修改需求：${d.request || "無"}<br>

      📩 修改狀態：
      <span style="
        color:${d.requestStatus === "已回覆" ? "#888" : "#d97706"};
        font-weight:700;
      ">
        ${d.requestStatus || "未處理"}
      </span>
      <br>

      🕒 ${formatTime(d.created)}<br>

<div style="margin-top:10px;">
  🚚 寄件單號：${d.trackingNo || "尚未填寫"}<br>

  <input
    id="tracking-${doc.id}"
    placeholder="輸入寄件單號"
    value="${d.trackingNo || ""}"
    style="margin:6px 0;"
  >

  <button onclick="replyRequest('${doc.id}')">已回覆修改</button>
  <button onclick="updateStatus('${doc.id}', '已付款')">標記已付款</button>
  <button onclick="updateStatus('${doc.id}', '已訂貨')">標記已訂貨</button>
  <button onclick="markShipped('${doc.id}')">標記已出貨</button>
  <button onclick="updateStatus('${doc.id}', '已完成')">標記完成</button>
</div>
    `;

    container.appendChild(div);
  });

  document.getElementById("totalOrders").textContent =
    "訂單數：" + totalOrders;

  document.getElementById("totalAmount").textContent =
    "訂單總金額：$" + formatMoney(totalAmount);

  renderProductStats(productStats);
}

function renderProductStats(productStats) {
  const statsEl = document.getElementById("productStats");
  statsEl.innerHTML = "";

  const groups = {};

  Object.keys(productStats).forEach(id => {
    const item = productStats[id];
    const groupName = item.series || "DARUMA";

    if (!groups[groupName]) groups[groupName] = [];

    groups[groupName].push(
      `${item.name}：${item.qty} 包／$${formatMoney(item.amount)}`
    );
  });

  const statsGrid = document.createElement("div");
  statsGrid.className = "stats-grid";
  statsEl.appendChild(statsGrid);

  Object.entries(groups).forEach(([title, items]) => {
    if (items.length === 0) return;

    const groupBox = document.createElement("div");
    groupBox.className = "stats-group";

    const titleEl = document.createElement("h4");
    titleEl.textContent = title;

    const ul = document.createElement("ul");

    items.forEach(text => {
      const li = document.createElement("li");
      li.textContent = text;
      li.style.marginBottom = "6px";
      ul.appendChild(li);
    });

    groupBox.appendChild(titleEl);
    groupBox.appendChild(ul);
    statsGrid.appendChild(groupBox);
  });
}

function listenOrders() {
  db.collection(ORDER_COLLECTION)
    .orderBy("created", "desc")
    .onSnapshot(renderOrders);
}

function listenWishlist() {
  db.collection(WISHLIST_COLLECTION)
    .orderBy("created", "desc")
    .onSnapshot(snapshot => {
      const container = document.getElementById("wishlist");
      container.innerHTML = "";

      if (snapshot.empty) {
        container.innerHTML = "<p>目前尚無許願資料。</p>";
        return;
      }

      snapshot.forEach(doc => {
        const d = doc.data();

        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
          <span class="badge">Wishlist</span><br>
          👤 ${d.name || ""}<br>
          📩 ${d.contact || ""}<br>
          ✨ ${d.wish || ""}<br>
          🕒 ${formatTime(d.created)}
        `;

        container.appendChild(div);
      });
    });
}

function sendStatusEmail(orderId, name, email, status) {
  // 如果 DARUMA 狀態信尚未建立，可先保留但不啟用。
  emailjs.send(
    "service_hc29cbj",
    "template_status",
    {
      order_id: orderId,
      to_name: name,
      to_email: email,
      status: status
    }
  ).catch(err => {
    console.error("狀態信寄送失敗", err);
  });
}

function updateStatus(id, status) {
  const ref = db.collection(ORDER_COLLECTION).doc(id);

  ref.update({ status })
    .then(() => ref.get())
    .then(doc => {
      const d = doc.data();

      if (d?.email) {
        sendStatusEmail(
          d.orderId,
          d.name,
          d.email,
          status
        );
      }
    });
}

function exportCSV() {
  db.collection(ORDER_COLLECTION)
    .get()
    .then(snapshot => {
      let csv = [];

      csv.push([
        "訂單編號",
        "姓名",
        "IG",
        "Email",
        "商品ID",
        "商品名稱",
        "數量",
        "單價",
        "小計",
        "狀態",
        "修改需求",
        "修改狀態",
        "時間"
      ]);

      snapshot.forEach(doc => {
        const d = doc.data();

        getOrderItems(d.cart).forEach(item => {
          csv.push([
            d.orderId || "",
            d.name || "",
            d.ig || "",
            d.email || "",
            item.id,
            item.name,
            item.qty,
            item.price,
            item.subtotal,
            d.status || "",
            d.request || "",
            d.requestStatus || "",
            formatTime(d.created)
          ]);
        });
      });

      downloadCSV(csv, "daruma_orders.csv");
    });
}

function exportWishlistCSV() {
  db.collection(WISHLIST_COLLECTION)
    .get()
    .then(snapshot => {
      let csv = [];

      csv.push([
        "姓名",
        "聯絡方式",
        "許願內容",
        "時間"
      ]);

      snapshot.forEach(doc => {
        const d = doc.data();

        csv.push([
          d.name || "",
          d.contact || "",
          d.wish || "",
          formatTime(d.created)
        ]);
      });

      downloadCSV(csv, "daruma_wishlist.csv");
    });
}

function downloadCSV(csv, filename) {
  const csvContent =
    "\uFEFF" +
    csv.map(row =>
      row.map(value => {
        const text = String(value ?? "").replace(/"/g, '""');
        return `"${text}"`;
      }).join(",")
    ).join("\n");

  const blob = new Blob(
    [csvContent],
    { type: "text/csv;charset=utf-8;" }
  );

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
}

function checkPassword() {
  const password = prompt("請輸入後台密碼");
  const adminPassword = "gusta6633";

  if (password !== adminPassword) {
    alert("密碼錯誤");
    document.body.innerHTML = "";
  }
}

function searchAdminOrder() {
  const keyword =
    document.getElementById("searchOrder")
      .value
      .trim();

  if (!keyword) {
    alert("請輸入搜尋內容");
    return;
  }

  const cards = document.querySelectorAll(".admin-order-card");

  cards.forEach(card => {
    const text = card.textContent;

    card.style.display =
      text.includes(keyword)
        ? "block"
        : "none";
  });
}

function clearAdminSearch() {
  document.getElementById("searchOrder").value = "";

  const cards = document.querySelectorAll(".admin-order-card");

  cards.forEach(card => {
    card.style.display = "block";
  });
}

function replyRequest(id) {
  db.collection(ORDER_COLLECTION)
    .doc(id)
    .update({
      requestStatus: "已回覆",
      request: ""
    });
}

loadProducts().then(() => {
  listenOrders();
  listenWishlist();
});
function markShipped(id) {
  const trackingNo = document.getElementById("tracking-" + id).value.trim();

  if (!trackingNo) {
    alert("請先填寫寄件單號");
    return;
  }

  db.collection("daruma_2026_summer").doc(id).update({
    status: "已出貨",
    trackingNo: trackingNo,
    shippedAt: firebase.firestore.FieldValue.serverTimestamp()
  })
  .then(() => {
    alert("已標記為出貨，並儲存寄件單號");
  })
  .catch(err => {
    console.error(err);
    alert("更新失敗，請稍後再試");
  });
}
</script>

</body>
</html>
